<title>RELISTO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Concepto: armario editorial. Barra lateral bosque en escritorio, navegación inferior en móvil; tarjetas blancas sobre marfil. */
:root {
  --ivory: #F7F4ED; --forest: #173F35; --sage: #DCE8DB; --coral: #D86A52; --lavender: #E8E0F2; --graphite: #252A29; --white: #FFFFFF; --gold: #D9B76F;
  --bg: var(--ivory); --surface: var(--white); --surface-2: #FBF9F4; --ink: var(--graphite); --ink-2: #5A605D; --ink-3: #7B817D;
  --line: #E5E0D4; --line-strong: #CFC8B8; --primary: var(--forest); --on-primary: #F7F4ED; --primary-soft: var(--sage); --on-soft: #173F35;
  --accent: var(--coral); --accent-ink: #A9452F; --accent-soft: #F8E2DB; --explore: var(--lavender); --on-explore: #45346A; --detail: var(--gold);
  --ok: #2F6B4F; --ok-soft: #DCE8DB; --warn: #8A5A12; --warn-soft: #F5E7C8; --bad: #A13A2A; --bad-soft: #F6DCD6; --info: #3E4F84; --info-soft: #E3E7F5;
  --tile: #F1EDE3; --nav: var(--forest); --on-nav: #EAF1EA; --nav-muted: #A9C2B4; --shadow: 0 1px 2px rgba(23,63,53,.06), 0 6px 20px rgba(23,63,53,.06);
  --font-body: "Manrope", "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-display: "DM Serif Display", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --r-sm: 8px; --r-md: 14px; --r-lg: 20px; --gutter: max(16px, env(safe-area-inset-left, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --surface: #19201D; --surface-2: #1E2622; --ink: #ECE9E1; --ink-2: #B9BDB6; --ink-3: #959B94; --line: #2B3531; --line-strong: #3B4842;
  --primary: #3F8A72; --on-primary: #F7F4ED; --primary-soft: #23382F; --on-soft: #CFE3D2; --accent: #E58A72; --accent-ink: #F0A592; --accent-soft: #3A2520;
  --explore: #2C2638; --on-explore: #D9CDEE; --detail: #D9B76F; --ok: #8CCBA8; --ok-soft: #1F3329; --warn: #E7C27A; --warn-soft: #3A2F18; --bad: #F0A08F; --bad-soft: #3D211C;
  --info: #B8C3EE; --info-soft: #232A42; --tile: #232B27; --nav: #0E1311; --on-nav: #E6EEE8; --nav-muted: #8DA699; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111614; --surface: #19201D; --surface-2: #1E2622; --ink: #ECE9E1; --ink-2: #B9BDB6; --ink-3: #959B94; --line: #2B3531; --line-strong: #3B4842;
  --primary: #3F8A72; --on-primary: #F7F4ED; --primary-soft: #23382F; --on-soft: #CFE3D2; --accent: #E58A72; --accent-ink: #F0A592; --accent-soft: #3A2520;
  --explore: #2C2638; --on-explore: #D9CDEE; --detail: #D9B76F; --ok: #8CCBA8; --ok-soft: #1F3329; --warn: #E7C27A; --warn-soft: #3A2F18; --bad: #F0A08F; --bad-soft: #3D211C;
  --info: #B8C3EE; --info-soft: #232A42; --tile: #232B27; --nav: #0E1311; --on-nav: #E6EEE8; --nav-muted: #8DA699; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--nav); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.15; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); }
:focus-visible { outline: 3px solid var(--detail); outline-offset: 2px; border-radius: 6px; }
.serif { font-family: var(--font-display); font-weight: 400; letter-spacing: .005em; }
.eyebrow { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--ink-3); }
.muted { color: var(--ink-2); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Estructura ---------- */
.shell { min-height: 100%; display: grid; grid-template-columns: 1fr; }
.side { display: none; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--nav); color: var(--on-nav);
  padding-left: var(--gutter); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; align-items: center; gap: 10px; }
.topbar .grow { flex: 1; min-width: 0; }
.main { padding-left: var(--gutter); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 120px; min-width: 0; }
.main-inner { max-width: 1160px; margin: 0 auto; display: grid; gap: 22px; }
.bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.bottomnav button { background: none; border: 0; padding: 8px 2px 9px; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.bottomnav button svg { width: 22px; height: 22px; }
.bottomnav button[aria-current="page"] { color: var(--primary); }
.bottomnav button[aria-current="page"] .navdot { background: var(--primary-soft); }
.navdot { padding: 3px 14px; border-radius: 999px; display: grid; }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 41; }
@media (min-width: 960px) {
  .shell { grid-template-columns: 252px 1fr; }
  .side { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--nav); color: var(--on-nav); padding: 22px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .topbar, .bottomnav, .fab { display: none; }
  .main { padding-block: 28px 48px; padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); }
}
.logo { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
.logo svg { width: 34px; height: 34px; flex: none; }
.logo b { font-family: var(--font-display); font-weight: 400; font-size: 23px; letter-spacing: .06em; }
.logo small { display: block; font-size: 10.5px; color: var(--nav-muted); letter-spacing: .02em; line-height: 1.25; }
.sidenav { display: grid; gap: 2px; }
.sidenav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; border: 0; background: transparent; color: var(--on-nav); font-weight: 600; cursor: pointer; }
.sidenav button svg { width: 20px; height: 20px; opacity: .9; }
.sidenav button:hover { background: rgba(255,255,255,.07); }
.sidenav button[aria-current="page"] { background: rgba(220,232,219,.16); box-shadow: inset 3px 0 0 var(--detail); }
.sidenav .sub button { font-weight: 500; font-size: 13.5px; color: var(--nav-muted); padding: 7px 12px; }
.side-label { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--nav-muted); font-weight: 700; padding: 0 12px; }
.side select, .topbar select { background: rgba(255,255,255,.08); color: var(--on-nav); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: 7px 10px; width: 100%; }
.side select option, .topbar select option { color: #252A29; background: #fff; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: rgba(255,255,255,.08); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; color: var(--on-nav); padding: 7px 6px; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--on-nav); color: #173F35; }
.demo-flag { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--gold); color: #3A2C0B; white-space: nowrap; }
.demo-flag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #3A2C0B; }
.real-flag { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--sage); color: #173F35; white-space: nowrap; }
.save-state { font-size: 11.5px; color: var(--nav-muted); line-height: 1.35; }
.save-state b { color: var(--on-nav); font-weight: 600; }

/* ---------- Componentes ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  padding: 9px 16px; font-weight: 700; font-size: 14px; cursor: pointer; line-height: 1.2; text-decoration: none; transition: background .15s, transform .15s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 17px; height: 17px; flex: none; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.soft { background: var(--primary-soft); border-color: transparent; color: var(--on-soft); }
.btn.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn.lg { padding: 13px 24px; font-size: 16px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.btn.big-cta { padding: 15px 26px; font-size: 17px; box-shadow: 0 6px 18px rgba(23,63,53,.22); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; }
.stack.tight { gap: 6px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; min-width: 0; }
.card.flat { box-shadow: none; }
.card.soft { background: var(--primary-soft); border-color: transparent; color: var(--on-soft); }
.card.explore { background: var(--explore); border-color: transparent; color: var(--on-explore); }
.card.warm { background: var(--accent-soft); border-color: transparent; }
.card h3 { font-size: 17px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-title h2 { font-family: var(--font-display); font-weight: 400; font-size: 27px; }
.grid { display: grid; gap: 14px; }
.grid.cards { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.grid.items { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.grid.two { grid-template-columns: 1fr; }
@media (min-width: 760px) { .grid.two { grid-template-columns: 1fr 1fr; } }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip.btnchip { cursor: pointer; }
.chip.btnchip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.chip.sim { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.chip.info { background: var(--info-soft); border-color: transparent; color: var(--info); }
.chip.explore { background: var(--explore); border-color: transparent; color: var(--on-explore); }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: currentColor; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.neutral { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.note { font-size: 13px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px dashed var(--line-strong); color: var(--ink-2); }
.note.sim { background: var(--warn-soft); border: 0; color: var(--warn); }
.note.ok { background: var(--ok-soft); border: 0; color: var(--ok); }
.note.info { background: var(--info-soft); border: 0; color: var(--info); }
.note.bad { background: var(--bad-soft); border: 0; color: var(--bad); }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }

/* Formularios */
.field { display: grid; gap: 5px; min-width: 0; }
.field > label, .field > .lbl { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.input, select.input, textarea.input { width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 11px; min-width: 0; }
textarea.input { resize: vertical; min-height: 72px; }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); }
.switch-row { display: flex; flex-wrap: wrap; gap: 8px 16px; }

/* Ilustraciones y tarjetas de prenda */
.illus { width: 100%; height: 100%; display: block; }
.thumb { aspect-ratio: 1 / 1; max-width: 100%; background: var(--tile); border-radius: 14px; display: grid; place-items: center; overflow: hidden; position: relative; }
.thumb > svg { width: 82%; height: 82%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb .tag { position: absolute; left: 7px; bottom: 7px; font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 2px 6px; border-radius: 6px; background: rgba(255,255,255,.85); color: #4D524F; }
.item-card { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px; text-align: left; cursor: pointer; min-width: 0; }
.item-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.item-card .name { font-weight: 700; font-size: 14px; line-height: 1.25; }
.item-card .meta { font-size: 12px; color: var(--ink-3); }
.item-card.gone { opacity: .62; }

/* Tarjetas de outfit */
.outfit { display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; position: relative; min-width: 0; }
.outfit.pinned { border-color: var(--detail); box-shadow: 0 0 0 2px var(--detail) inset; }
.outfit.partial { background: var(--surface-2); border-style: dashed; }
.outfit.invalid { opacity: .7; }
.outfit .role { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; color: var(--accent-ink); }
.outfit h3 { font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.collage { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.collage .thumb { border-radius: 12px; }
.collage .big { grid-column: span 3; }
.collage .mid { grid-column: span 2; }
.collage .acc { grid-column: span 1; }
.collage .missing-tile { aspect-ratio: 1/1; border: 2px dashed var(--line-strong); border-radius: 12px; display: grid; place-items: center; text-align: center; font-size: 11px; font-weight: 700; color: var(--bad); padding: 4px; background: var(--surface); }
.meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.meter.partial > i { background: var(--accent); }
.units { display: grid; gap: 4px; font-size: 12.5px; }
.units li { display: flex; gap: 6px; align-items: baseline; }
.mark { font-weight: 800; width: 14px; flex: none; }
.mark.ok { color: var(--ok); } .mark.no { color: var(--bad); }
ul.clean { list-style: none; padding: 0; margin: 0; }
.pieces { display: grid; gap: 6px; }
.pieces li { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.pieces .dot { width: 12px; height: 12px; border-radius: 4px; margin-top: 4px; flex: none; border: 1px solid rgba(0,0,0,.15); }
.why li { font-size: 13.5px; padding-left: 16px; position: relative; }
.why li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--detail); }
details.more > summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--primary); list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+ "; }
details.more[open] > summary::before { content: "− "; }

/* Hero de hoy */
.hero { display: grid; gap: 16px; padding: 22px; border-radius: 26px; background: var(--surface); border: 1px solid var(--line); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; border: 26px solid var(--sage); opacity: .55; pointer-events: none; }
.hero h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 5vw, 46px); max-width: 18ch; }
.hero h1 em { font-style: italic; color: var(--accent-ink); }
.hero > * { position: relative; z-index: 1; }
.ctx-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.layout-today { display: grid; gap: 22px; grid-template-columns: 1fr; }
@media (min-width: 1180px) { .layout-today { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; } }

/* Tablas */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); background: var(--surface-2); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* Pasos */
.steps { display: flex; flex-wrap: wrap; gap: 6px; }
.steps span { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-3); }
.steps span.done { background: var(--primary-soft); border-color: transparent; color: var(--on-soft); }
.steps span.now { background: var(--primary); border-color: transparent; color: var(--on-primary); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 12px; font-weight: 700; color: var(--ink-2); cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }

/* Modal y avisos */
.overlay { position: fixed; inset: 0; z-index: 80; background: rgba(17,22,20,.48); display: grid; place-items: end center; padding-top: env(safe-area-inset-top, 0px); }
@media (min-width: 720px) { .overlay { place-items: center; padding: 24px; } }
.modal { background: var(--bg); color: var(--ink); width: 100%; max-width: 720px; max-height: calc(100% - 24px); overflow-y: auto; border-radius: 24px 24px 0 0; padding: 20px;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
@media (min-width: 720px) { .modal { border-radius: 24px; max-height: 90vh; } }
.modal h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; }
.modal-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.toast { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); background: var(--graphite); color: #F7F4ED; padding: 11px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; max-width: min(92vw, 520px); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
@media (min-width: 960px) { .toast { bottom: 28px; } }
.empty { text-align: center; padding: 26px 16px; display: grid; gap: 10px; justify-items: center; color: var(--ink-2); }
.empty svg { width: 58px; height: 58px; color: var(--line-strong); }
.kpi { display: grid; gap: 2px; }
.kpi b { font-size: 26px; font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -.01em; }
.kpi span { font-size: 12.5px; color: var(--ink-2); }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }

/** Devuelve combinaciones completas y parciales, deterministas, deduplicadas. */

  const must = opts.mustUse && pool.find((i) => i.id === opts.mustUse) ? opts.mustUse : null;
  const notes = [];
  if (opts.mustUse && !must) notes.push('La prenda que quieres usar no está disponible para este perfil o fue excluida.');
  const seen = new Set(); const complete = []; const partial = [];

    const ids = t.itemIds.filter((id) => pool.some((p) => p.id === id));

  else if (complete.length < 3) notes.push('Solo hay ' + complete.length + ' combinación' + (complete.length > 1 ? 'es completas' : ' completa') + ' para este contexto con tu armario disponible: el código de vestimenta y la disponibilidad limitan las opciones.');

/** Selecciona hasta `n` candidatos variados (≥2 piezas principales distintas si se puede, ≥1 siempre). */

/* ---------- Cobertura del armario (plantillas de interés) ---------- */
function templateCoverage(ws, ownerId, interestIds) {
  const list = ws.templates.filter((t) => t.ownerId === ownerId && (!interestIds || interestIds.includes(t.id)));
  const rows = list.map((t) => {
    const ctx = ws.contexts.find((c) => c.id === t.contextId);

/* ---------- Valor de una compra: combinaciones nuevas ---------- */
function comboSet(ws, ownerId, extraItem) {
  const items = ownedItems(ws, ownerId).filter((i) => isUsable(i)).concat(extraItem ? [extraItem] : []);
  const contexts = ws.contexts.filter((c) => c.ownerId === ownerId);
  const set = new Map();
  contexts.forEach((ctx) => {
    const ok = (i) => formalityOk(i, ctx);
    const hard = ctx.hard || {};
    const tops = items.filter((i) => roleOf(i) === 'top' && ok(i) && meetsHard(i, hard.superior));
    const bottoms = items.filter((i) => roleOf(i) === 'bottom' && ok(i) && meetsHard(i, hard.inferior));
    const fulls = items.filter((i) => roleOf(i) === 'full' && ok(i));
    const shoes = items.filter((i) => roleOf(i) === 'shoes' && ok(i) && meetsHard(i, hard.calzado));
    const needLayer = ctx.requiredSlots.includes('capa');
    const layers = needLayer ? items.filter((i) => roleOf(i) === 'layer' && ok(i) && meetsHard(i, hard.capa)) : [null];
    const bases = []; tops.forEach((t) => bottoms.forEach((b) => bases.push([t, b]))); fulls.forEach((f) => bases.push([f]));
    bases.forEach((b) => shoes.forEach((s) => layers.forEach((l) => {
      const combo = [...b, s, l].filter(Boolean);
      if (!harmony(combo.filter((i) => roleOf(i) !== 'layer')).ok) return;
      const key = combo.map((i) => i.id).sort().join('+');
      if (!set.has(key)) set.set(key, { key, items: combo, contexts: [ctx.name] });

/* ---------- Ofertas simuladas ---------- */
function searchOffers(offers, req, f) {
  const results = []; const pending = []; const excluded = []; const notes = [];
  const budget = Number(f.budget) || null;
  offers.forEach((o) => {
    const matches = []; const pendingData = [];
    const fail = (why) => excluded.push({ offer: o, reason: why });
    if (f.color && !norm(o.color).includes(norm(f.color))) return fail('Color distinto (' + o.color + ')');
    matches.push('color ' + o.color);
    if (f.material && !norm(o.material).includes(norm(f.material))) return fail('Material distinto (' + o.material + ')');
    matches.push('material ' + o.material);
    if (f.size && norm(o.size) !== norm(f.size)) return fail('Talla distinta (' + o.size + ')');
    matches.push('talla ' + o.size);
    if (f.subtype && !norm(o.product).includes(norm(f.subtype))) return fail('No es ' + f.subtype);
    if (f.condition && f.condition !== 'cualquiera' && o.condition !== f.condition) return fail('Condición ' + o.condition);
    if (f.physical) {
      if (!f.districts.includes(o.district)) return fail('Tienda ubicada fuera de los distritos elegidos (' + o.district + ')');
      matches.push('tienda en ' + o.district);
    }
    if (f.modality === 'recojo' && !f.physical && !f.districts.includes(o.district)) { /* recojo fuera de distritos: se informa */ pendingData.push('recojo en ' + o.district); }
    const shipping = f.modality === 'recojo' ? 0 : o.deliveryPEN;
    const total = f.modality === 'recojo' ? o.pricePEN : (o.deliveryPEN === null ? null : o.pricePEN + o.deliveryPEN);
    if (f.modality === 'delivery' && o.deliveryPEN === null) pendingData.push('envío sin cotizar');
    if (f.modality === 'delivery' && !f.physical) pendingData.push('cobertura de delivery no confirmada');
    let budgetState = 'sin presupuesto';
    if (budget) {
      const base = f.budgetMode === 'producto' ? o.pricePEN : total;
      if (base === null) budgetState = 'desconocido';
      else if (base <= budget) budgetState = 'cumple';
      else return fail('Supera el presupuesto (' + fmtPEN(base) + ' > ' + fmtPEN(budget) + ')');
    }
    const eta = f.modality === 'recojo' ? o.pickupInDays : o.deliveryInDays;
    const row = { offer: o, shipping, total, eta, matches, pendingData, budgetState, stock: o.stockDemo };
    if (total === null || budgetState === 'desconocido') pending.push(row); else results.push(row);
  });
  results.sort((a, b) => b.matches.length - a.matches.length || a.total - b.total || (b.stock > 0) - (a.stock > 0) || a.eta - b.eta);
  if (results.length) results[0].lowestKnown = true;
  const shown = results.slice(0, 3);
  const pend = pending.slice(0, Math.max(0, 3 - shown.length));
  if (shown.length + pend.length < 3) notes.push('Se encontraron ' + (shown.length + pend.length) + ' de 3 opciones con estos filtros. No se inventan resultados para completar.');
  if (!f.physical && f.modality === 'delivery') notes.push('Sin filtro de tienda física: el catálogo simulado no confirma cobertura de delivery por distrito.');

const ORDER_FLOW = {

  delivery: ['confirmado (simulado)', 'en preparación (simulado)', 'en reparto (simulado)', 'recibido/recogido (simulado)']

function nextOrderStatus(order) {
  const flow = ORDER_FLOW[order.modality] || ORDER_FLOW.recojo;

/* ---------- Desuso y hábitos ---------- */
function dormantItems(ws, ownerId, threshold, today) {
  const review = []; const excluded = [];
  ownedItems(ws, ownerId).forEach((i) => {
    if (isGone(i)) return;
    const d = daysSinceUse(ws, i, today);
    if (d.days < threshold) return;
    const ex = Object.entries(i.exclusions || {}).filter(([, v]) => v).map(([k]) => k);
    const row = { item: i, days: d.days, basis: d.basis };
    if (ex.length) excluded.push(Object.assign(row, { exclusions: ex })); else review.push(row);
  });
  review.sort((a, b) => b.days - a.days);
  return { review, excluded };
}
function habits(ws, ownerId, today, periodDays) {
  const items = ownedItems(ws, ownerId);
  const eligible = items.filter((i) => !isGone(i));
  const from = addDays(today, -periodDays);
  const usedInPeriod = new Set();
  let confirmedInPeriod = 0;
  ws.wearLogs.filter((l) => l.ownerId === ownerId && l.status === 'usado' && l.date > from).forEach((l) => { confirmedInPeriod++; l.snapshot.items.forEach((s) => usedInPeriod.add(s.id)); });
  eligible.forEach((i) => { const st = itemStats(ws, i); if (st.lastUsed && st.lastUsed > from) usedInPeriod.add(i.id); });
  const withUse = eligible.filter((i) => itemStats(ws, i).wearCount > 0).length;
  const cpu = eligible.filter((i) => i.price).map((i) => { const st = itemStats(ws, i); return { item: i, uses: st.wearCount, cpu: st.wearCount ? i.price / st.wearCount : null }; });
  const recovered = ws.wearLogs.filter((l) => l.ownerId === ownerId && l.status === 'usado').reduce((a, l) => a + (l.recovered || []).length, 0);
  const repairs = ws.circular.filter((c) => c.ownerId === ownerId && c.kind === 'reparacion' && c.status === 'completada').length;
  const donations = ws.circular.filter((c) => c.ownerId === ownerId && c.kind === 'donacion' && c.status === 'entregada (demo)').length;
  return {
    distinctUsed: [...usedInPeriod].filter((id) => eligible.some((i) => i.id === id)).length, eligible: eligible.length,
    pctWithUse: eligible.length ? Math.round((100 * withUse) / eligible.length) : 0, confirmedInPeriod,
    totalUses: eligible.reduce((a, i) => a + itemStats(ws, i).wearCount, 0), cpu, recovered, repairs, donations
  };
}

/* ---------- Texto libre → campos de contexto ---------- */
function parseContextText(text, base) {
  const t = norm(text); const out = {}; const found = [];
  const occ = OCCASIONS.slice().sort((a, b) => b.length - a.length).find((o) => t.includes(norm(o)));
  if (occ) { out.occasion = occ; found.push('ocasión: ' + occ); }
  const dist = LIMA_DISTRICTS.find((d) => t.includes(norm(d)));
  if (dist) { out.district = dist; found.push('distrito: ' + dist); }
  const intents = [];
  if (/profesional/.test(t)) intents.push('profesionalismo');
  if (/cercan|cercano|cercana|amable/.test(t)) intents.push('cercanía');
  if (/confian|seguro de mi|segura de mi/.test(t)) intents.push('confianza');
  if (/elegan/.test(t)) intents.push('elegancia');
  if (/creativ/.test(t)) intents.push('creatividad');
  if (/deslumbr/.test(t)) intents.push('deslumbrar');
  if (/romant/.test(t)) intents.push('intención romántica');
  if (/desapercib|discret/.test(t)) intents.push('pasar desapercibido');
  if (/visib|protagon/.test(t)) intents.push('máxima visibilidad');
  if (/comod/.test(t)) intents.push('comodidad');
  if (intents.length) { out.intent = intents; found.push('intención: ' + intents.join(', ')); }
  if (/caminar[ée] (bastante|mucho)|mucho caminar|caminar mucho|caminare bastante/.test(t)) { out.walking = 'alta'; found.push('caminar: alta'); }
  else if (/camin/.test(t)) { out.walking = 'moderada'; found.push('caminar: moderada'); }
  const col = t.match(/prefiero (el |los |tonos? )?([a-z ]+?)(\.|,|$| y )/);
  if (col) { const c = col[2].trim(); if (c && c.length < 20) { out.colorsPref = [c]; found.push('color preferido: ' + c); } }
  const temp = t.match(/(\d{1,2})\s?(°|grados|ºc|°c)/);
  if (temp) { out.temperatureC = Number(temp[1]); found.push('temperatura: ' + temp[1] + ' °C'); }
  const hr = t.match(/a las (\d{1,2})(?::(\d{2}))?/);
  if (hr) { out.time = String(hr[1]).padStart(2, '0') + ':' + (hr[2] || '00'); found.push('hora: ' + out.time); }
  if (/importante|entrevista|presentaci/.test(t) && !out.dressCode) { out.dressCode = 'business casual'; out.formality = 3; found.push('código sugerido: business casual'); }
  if (/formal|boda|gala/.test(t)) { out.dressCode = 'formal'; out.formality = 4; }
  return { fields: out, found };
}

/* ---------- Importación segura ---------- */
function validateImport(obj) {

  const spaces = obj.spaces || {};
  ['demo', 'personal'].forEach((k) => {

/* ---- Reparación, desuso y circularidad ---- */
function startRepair(ws, itemId, today) {
  const it = ws.items.find((i) => i.id === itemId);
  if (!it || isGone(it)) return null;
  it.availability = 'en reparación'; it.updatedAt = today;
  const a = { id: nextId(ws, 'cir', 'CIR', 2), ownerId: it.ownerId, itemId, kind: 'reparacion', status: 'en curso', createdAt: today, history: [{ status: 'en curso', at: today }], origin: ws.mode === 'demo' ? 'demo' : 'real' };
  ws.circular.push(a);
  return a;
}
function completeRepair(ws, itemId, today) {
  const it = ws.items.find((i) => i.id === itemId);
  if (!it || it.availability !== 'en reparación') return null;
  it.availability = 'disponible'; it.updatedAt = today;
  let a = ws.circular.find((c) => c.itemId === itemId && c.kind === 'reparacion' && c.status === 'en curso');
  if (!a) { a = { id: nextId(ws, 'cir', 'CIR', 2), ownerId: it.ownerId, itemId, kind: 'reparacion', status: 'en curso', createdAt: today, history: [], origin: ws.mode === 'demo' ? 'demo' : 'real' }; ws.circular.push(a); }
  a.status = 'completada'; a.history.push({ status: 'completada', at: today });
  ws.missing.filter((m) => m.existingCompatibleItemId === itemId && m.status === 'abierta').forEach((m) => { m.status = 'resuelta con reparación'; });
  ws.plans.filter((p) => ws.missing.some((m) => m.id === p.requirementId && m.existingCompatibleItemId === itemId)).forEach((p) => { if (!/compra/.test(p.status)) p.status = 'resuelto con reparación'; });
  return a;
}
function circularIntent(ws, itemId, kind, today, details) {
  const it = ws.items.find((i) => i.id === itemId);
  if (!it || isGone(it)) return null;
  const open = ws.circular.find((c) => c.itemId === itemId && c.kind === kind && c.status === 'intención');
  if (open) return open;
  const a = Object.assign({ id: nextId(ws, 'cir', 'CIR', 2), ownerId: it.ownerId, itemId, kind, status: 'intención', destination: null, condition: '', clean: false, createdAt: today, history: [{ status: 'intención', at: today }], origin: ws.mode === 'demo' ? 'demo' : 'real' }, details || {});
  ws.circular.push(a);
  ws.circular.filter((c) => c.itemId === itemId && c.kind === 'revision').forEach((c) => { c.status = 'en curso'; });
  return a;
}
function confirmCircular(ws, actionId, today) {
  const a = ws.circular.find((c) => c.id === actionId);
  if (!a || a.status !== 'intención') return { action: a, changed: false };
  const it = ws.items.find((i) => i.id === a.itemId);
  a.status = a.kind === 'donacion' ? 'entregada (demo)' : a.kind === 'venta' ? 'vendida (demo)' : 'acordado (demo)';
  a.history.push({ status: a.status, at: today });
  if (it && a.kind === 'donacion') it.availability = 'donada';
  if (it && a.kind === 'venta') it.availability = 'vendida';
  if (it && a.kind === 'prestamo') it.availability = 'prestada';
  ws.circular.filter((c) => c.itemId === a.itemId && c.kind === 'revision').forEach((c) => { c.status = 'resuelta'; });
  return { action: a, changed: true };
}
function cancelCircular(ws, actionId, today) {
  const a = ws.circular.find((c) => c.id === actionId);
  if (!a || a.status !== 'intención') return null;
  a.status = 'cancelada'; a.history.push({ status: 'cancelada', at: today });
  return a;
}

/* ---- Pedidos simulados ---- */
function createOrder(ws, offer, modality, today, token) {
  const prev = ws.orders.find((o) => o.checkoutToken && o.checkoutToken === token);
  if (prev) return prev;
  const total = modality === 'recojo' ? offer.pricePEN : (offer.deliveryPEN === null ? null : offer.pricePEN + offer.deliveryPEN);
  if (total === null) return null; // no se confirma con importe incompleto
  const req = ws.missing.find((m) => m.id === offer.requirementId);
  const o = {
    id: 'DEMO-' + ws.seq.order++, ownerId: ws.activeProfileId, demo: true, source: 'simulación', offerId: offer.id, product: offer.product,
    category: req ? req.category : 'calzado', subtype: req ? req.subtype : '', material: offer.material, color: offer.color, size: offer.size,
    store: offer.store, district: offer.district, modality, pricePEN: offer.pricePEN, deliveryPEN: modality === 'recojo' ? 0 : offer.deliveryPEN, total,
    etaDays: modality === 'recojo' ? offer.pickupInDays : offer.deliveryInDays, status: 'confirmado (simulado)', createdAt: today,
    history: [{ status: 'confirmado (simulado)', at: today }], addedItemId: null, checkoutToken: token, requirementId: offer.requirementId,
    note: 'Pedido simulado: no hay pago, reserva ni comercio real.'
  };
  ws.orders.push(o);
  ws.plans.filter((p) => p.requirementId === offer.requirementId).forEach((p) => { p.status = 'compra simulada confirmada'; });
  return o;
}
function advanceOrder(ws, orderId, today) {
  const o = ws.orders.find((x) => x.id === orderId);
  if (!o || !o.demo) return null;
  const nx = nextOrderStatus(o);
  if (!nx) return null;
  o.status = nx; o.history.push({ status: nx, at: today });
  return o;
}
function cancelOrder(ws, orderId, today) {
  const o = ws.orders.find((x) => x.id === orderId);
  if (!o || isReceived(o) || o.status === 'cancelado') return null;
  o.status = 'cancelado'; o.history.push({ status: 'cancelado', at: today });
  return o;
}
function addOrderItem(ws, orderId, fields, today) {
  const o = ws.orders.find((x) => x.id === orderId);
  if (!o || !isReceived(o)) return { item: null, added: false };
  if (o.addedItemId) return { item: ws.items.find((i) => i.id === o.addedItemId), added: false };
  const item = addItem(ws, Object.assign({
    name: o.product, category: o.category || 'superior', color: o.color, material: o.material, size: o.size,
    sizeSystem: /^EU/.test(o.size) ? 'EU' : 'letras', price: o.pricePEN, acquisition: 'compra simulada ' + o.id,
    attributeSource: 'ficha del pedido simulado', ownerId: o.ownerId
  }, fields || {}), today);
  o.addedItemId = item.id;
  return { item, added: true };
}

function compressImage(file, max, quality) {
  max = max || 1400; quality = quality || 0.82;
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {

      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);

      const ctx = cv.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);

    img.src = url;

}

function attachPhoto(modal, file) {

  compressImage(file).then((blob) => {
    if (blob !== file) { ph.file = blob; ph.url = URL.createObjectURL(blob); }
    return dominantColor(ph.file);

    const d = modal.draft; const name = nearestColorName(hex);
    modal.detectedHex = hex; modal.detected = name;
    if (!d.color || d.color === 'sin color' || d.color === modal.prevDetected) { d.color = name; d.photoHex = hex; }
    else if (norm(d.color) === norm(name)) d.photoHex = hex;
    modal.prevDetected = name;

}
/** Guarda una foto: las del armario personal van cifradas con la clave de la cuenta; las de la demo, tal cual. */
async function persistPhoto(key, ph) {
  if (!IS_PWA || !ph || !ph.file) return;
  const [sp, id] = key.split(':');
  try {
    if (sp === 'personal') {
      if (!AUTH.acct || !AUTH.key) return;
      const rec = await encryptBuf(AUTH.key, await ph.file.arrayBuffer());
      await LOCAL.photoPutRaw('u:' + AUTH.acct.id + ':' + id, { enc: true, type: ph.file.type || 'image/jpeg', iv: rec.iv, ct: rec.ct });

}

async function initLocal() {
  try {
    const raw = await LOCAL.get('state');
    AUTH.accounts = (await LOCAL.get('accounts')) || [];
    const welcomed = await LOCAL.get('welcomed');
    (await LOCAL.photoRange('demo:')).forEach(({ key, val }) => {
      if (!val || !val.buf) return;
      const blob = new Blob([val.buf], { type: val.type || 'image/jpeg' });
      PHOTOS[key] = { url: URL.createObjectURL(blob), file: blob, originalUrl: null, cropped: false };
    });
    let parsed = null;
    if (raw && !CAP.dirty) { try { parsed = JSON.parse(raw); } catch (e) { parsed = null; } if (parsed && !validateImport(parsed).ok) parsed = null; }
    if (parsed) {
      S.demo = parsed.spaces.demo || S.demo;
      if (parsed.spaces.personal && parsed.spaces.personal.items) LEGACY.personal = parsed.spaces.personal; // armario de la versión sin cuentas
      UI.view = (parsed.ui && parsed.ui.view) || UI.view; UI.sceneHint = false;
    }
    S.personal = null; S.space = 'demo';
    if (LEGACY.personal) LEGACY.photoCount = (await LOCAL.photoRange('personal:')).length;
    CAP.storage = 'local';
    const restored = await restoreSession();
    if (!restored) {
      if (AUTH.accounts.length) UI.auth = { screen: 'login', acctId: AUTH.accounts.length === 1 ? AUTH.accounts[0].id : null };
      else if (!welcomed || LEGACY.personal) UI.auth = { screen: 'welcome' };
    } else if (parsed && parsed.space === 'demo') S.space = 'demo';
    if (!raw) await doSave();
    render();

    if (!UI.auth) maybeAutoTour();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then((p) => { CAP.persisted = p; }).catch(() => {});
    if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then((e) => { CAP.usage = e; }).catch(() => {});

function draftHash(d) { return JSON.stringify([d.id, d.occasion, d.dressCode, d.formality, d.temperatureC, d.walking, d.intent, d.colorsPref, d.onlyAvailable, d.noRepeatYesterday, d.mustUse, d.exclude, d.requiredSlots]); }

function genState() { return UI.gen[genKey()] || null; }

function doGenerate(mode) {
  const d = currentDraft(); const p = prof(); if (!d) return;
  const r = generateOutfits(ws(), d, p, genOpts(d), TODAY);
  const k = genKey(); const prev = UI.gen[k];
  const dismissed = prev ? prev.dismissed : [];
  const live = r.complete.filter((c) => !dismissed.includes(c.key));
  const liveP = r.partial.filter((c) => !dismissed.includes(c.key));
  const base = live.length ? live : liveP;
  let slots;
  let shown = prev && mode ? prev.shown.slice() : [];
  let pinned = prev && prev.pinned ? prev.slots.find((s) => s.key === prev.pinned) : null;
  let note = '';
  if (mode === 'more' && prev) {
    const room = Math.min(3, 6 - prev.slots.length);
    const add = room > 0 ? pickDiverse(base.filter((c) => !prev.slots.some((s) => s.key === c.key)), prev.slots, room, ws()) : [];
    slots = prev.slots.concat(add);
    if (!add.length) note = 'No hay más combinaciones distintas con tu armario actual para este contexto.';
  } else if (mode === 'regen' && prev) {
    const keep = pinned ? [pinned] : [];
    const want = Math.max(3, prev.slots.length) - keep.length;
    const fresh = base.filter((c) => !shown.includes(c.key) && !keep.some((x) => x.key === c.key));
    const add = pickDiverse(fresh, keep, want, ws());
    slots = keep.concat(add);
    if (add.length < want) note = add.length ? 'Solo quedaban ' + add.length + ' combinaciones nuevas: no repetimos para llenar cupos.' : 'Ya viste todas las combinaciones distintas. Puedes empezar una ronda nueva.';
  } else {
    pinned = null; shown = [];
    slots = pickDiverse(base, [], 3, ws());
  }
  slots = slots.slice(0, 6);
  slots.forEach((s) => { if (!shown.includes(s.key)) shown.push(s.key); });
  UI.gen[k] = { slots, shown, pinned: pinned ? pinned.key : null, notes: r.notes, note, mode: live.length ? 'complete' : 'partial', completeCount: live.length,
    partials: live.length ? liveP.slice(0, 3) : [], dismissed, hash: draftHash(d), at: Date.now() };
  logEvent('generate');
}

    let fix = '';

    if (blockedId) {
      const b = w.items.find((i) => i.id === blockedId);

    } else if (!u.covered && !u.itemId && /^Tienes /.test(u.note)) {

    } else if (!u.covered && !u.itemId && !d.noShopping) {

  }).join('') + '</ul>';

  const source = c.source === 'plantilla' ? 'Receta ' + esc(c.templateId) : c.source === 'editado' ? 'Editada por ti' : 'Generada por reglas';
  const reasons = c.reasons && c.reasons.length ? '<ul class="clean why stack tight">' + c.reasons.slice(0, 2).map((r) => '<li>' + esc(r) + '</li>').join('') + '</ul>' : '';
  return '<article class="outfit' + (partial ? ' partial' : '') + (pinned ? ' pinned' : '') + (invalid ? ' invalid' : '') + '" aria-label="' + esc(c.name) + '">' +
    '<div class="row between" style="flex-wrap:nowrap"><span class="role">' + esc(role) + '</span><span class="pct' + (partial ? ' partial' : '') + '"><b class="num">' + comp.percent + '% completo</b></span></div>' +
    '<h3>' + esc(c.name) + '</h3>' + collage + reasons +
    (partial ? '<div class="stack tight"><span class="small num muted">' + comp.covered + ' de ' + comp.total + ' unidades imprescindibles</span>' + units + '</div>' : '') +
    primary + (invalid ? '' : '<button type="button" class="btn ghost wide look-btn" data-act="lookOpen" data-key="' + esc(c.key) + '">' + IC.figure + 'Ver outfit completo</button>') + icons +

    '<div class="row" style="gap:4px"><span class="chip">' + esc(c.style || '') + '</span><span class="chip info" title="Sugerencia por reglas de demostración, sin IA">' + source + '</span></div>' +
    pieces + '<div class="stack tight"><div class="row between"><b class="small">Completitud</b><span class="small muted num">' + comp.covered + ' de ' + comp.total + ' unidades</span></div><div class="meter' + (partial ? ' partial' : '') + '" role="img" aria-label="' + comp.percent + ' por ciento"><i style="width:' + comp.percent + '%"></i></div>' + (partial ? '' : units) +

    (cov.total ? '<div class="kpi"><b class="num">' + cov.ok + ' de ' + cov.total + '</b><span>plantillas de interés que puedes completar hoy <button class="btn sm ghost" data-act="coverage">Ver cuáles</button></span></div>' : '') +

/* ---------- Giro 360° ---------- */
function turntableHTML(p, items, label) {
  return '<div class="turn" data-turn aria-label="Figura con giro 360°. Desliza para girarla.">' +
    '<div class="turn-stage"><div class="turn-face front">' + figureSVG(p, items, { label: label || 'Figura de frente' }) + '</div>' +
    '<div class="turn-face back" hidden>' + figureSVG(p, items, { view: 'back', label: 'Figura de espalda' }) + '</div></div>' +
    '<span class="turn-badge" aria-live="polite">Frente</span><span class="turn-hint" aria-hidden="true">↔ Desliza para girar</span></div>' +
    '<div class="turn-ctl"><button type="button" class="btn sm primary" data-act="turnSpin">' + IC.circular + 'Girar 360°</button><button type="button" class="btn sm" data-act="turnTo" data-a="0">Frente</button><button type="button" class="btn sm" data-act="turnTo" data-a="180">Espalda</button></div>';
}
const TURN = { angle: 0, raf: null };
function applyTurn(root, deg) {
  const stage = root.querySelector('.turn-stage'); if (!stage) return;
  const r = deg * Math.PI / 180; const c = Math.cos(r);
  const sx = Math.max(0.12, Math.abs(c));
  const front = c >= 0;
  stage.style.transform = 'scaleX(' + sx.toFixed(3) + ')';
  stage.style.filter = 'brightness(' + (0.92 + 0.08 * Math.abs(c)).toFixed(3) + ')';
  const f = root.querySelector('.turn-face.front'); const bk = root.querySelector('.turn-face.back');
  if (f && bk) { f.hidden = !front; bk.hidden = front; }
  const badge = root.querySelector('.turn-badge'); if (badge) { const lbl = Math.abs(c) < 0.35 ? 'Perfil' : front ? 'Frente' : 'Espalda'; if (badge.textContent !== lbl) badge.textContent = lbl; }
}
function reducedMotion() { const p = prof(); return !!((p && p.reduceMotion) || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)); }
function wireTurntables() {
  document.querySelectorAll('[data-turn]').forEach((root) => {
    if (root.dataset.wired) return; root.dataset.wired = '1';
    applyTurn(root, TURN.angle);
    let drag = null;
    root.addEventListener('pointerdown', (e) => { cancelAnimationFrame(TURN.raf); drag = { x: e.clientX, a: TURN.angle, moved: false }; try { root.setPointerCapture(e.pointerId); } catch (er) { /* */ } root.classList.add('dragging'); });
    root.addEventListener('pointermove', (e) => { if (!drag) return; const dx = e.clientX - drag.x; if (Math.abs(dx) > 3) drag.moved = true; TURN.angle = drag.a + dx * 1.4; applyTurn(root, TURN.angle); });
    const end = () => { if (!drag) return; drag = null; root.classList.remove('dragging'); const hint = root.querySelector('.turn-hint'); if (hint) hint.remove(); UI.turnUsed = true; };
    root.addEventListener('pointerup', end); root.addEventListener('pointercancel', end);
    root.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); TURN.angle += e.key === 'ArrowRight' ? 30 : -30; applyTurn(root, TURN.angle); } });
    root.tabIndex = 0;
    if (UI.turnUsed) { const hint = root.querySelector('.turn-hint'); if (hint) hint.remove(); }
  });
}
function spinTo(target, ms) {
  const root = document.querySelector('[data-turn]'); if (!root) return;
  cancelAnimationFrame(TURN.raf);
  if (reducedMotion()) { TURN.angle = target; applyTurn(root, TURN.angle); return; }
  const from = TURN.angle; const t0 = performance.now(); const dur = ms || 2200;
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const step = (now) => {
    const t = Math.min(1, (now - t0) / dur); TURN.angle = from + (target - from) * ease(t);
    const r = document.querySelector('[data-turn]'); if (r) applyTurn(r, TURN.angle);
    if (t < 1) TURN.raf = requestAnimationFrame(step); else TURN.angle = ((TURN.angle % 360) + 360) % 360;
  };
  TURN.raf = requestAnimationFrame(step);
}

/* ---------- "Cambiar una prenda" para celular ---------- */
function swapSlots(c, d, items) {
  const full = items.find((i) => roleOf(i) === 'full');
  const slots = [];
  if (full) slots.push({ id: 'full', label: 'Vestido o enterizo', role: 'full', hardSlot: 'superior' });
  else { slots.push({ id: 'superior', label: 'Superior', role: 'top', hardSlot: 'superior' }); slots.push({ id: 'inferior', label: 'Inferior', role: 'bottom', hardSlot: 'inferior' }); }
  slots.push({ id: 'calzado', label: 'Calzado', role: 'shoes', hardSlot: 'calzado' });
  if (d.requiredSlots.includes('capa')) slots.push({ id: 'capa', label: 'Capa', role: 'layer', hardSlot: 'capa' });
  slots.push({ id: 'extras', label: 'Extras' });
  return slots;
}
function swapRow(a, act, from, d, note) {
  const ok = isUsable(a);
  const hint = !ok ? availBadge(a.availability) : (roleOf(a) !== 'accessory' && !formalityOk(a, d) ? '<span class="badge warn">menos formal para ' + esc(d.dressCode) + '</span>' : (note || ''));
  return '<button type="button" class="swap-row' + (ok ? '' : ' off') + '" data-act="' + act + '" data-from="' + (from || '') + '" data-to="' + a.id + '"' + (ok ? '' : ' aria-disabled="true"') + '>' +

    '<span class="swap-go" aria-hidden="true">' + (ok ? (act === 'addPiece' ? 'Añadir' : 'Usar') : '—') + '</span></button>';
}
renderSwap = function (m) { // eslint-disable-line no-func-assign
  const w = ws(); const d = currentDraft(); const c = findCandidate(m.key);
  if (!c) return modalWrap('Cambiar una prenda', '<p>La propuesta ya no está en pantalla. Vuelve a “Arma mi día”.</p>');
  const items = c.itemIds.map((id) => w.items.find((i) => i.id === id)).filter(Boolean);
  const owned = ownedItems(w, d.ownerId).filter((i) => !isGone(i));
  const slots = swapSlots(c, d, items);
  const slot = slots.find((s) => s.id === m.slot) || slots[0]; m.slot = slot.id;
  const comp = completeness(w, c.itemIds, d, c.template);
  const head = '<div class="swap-head"><span class="minis">' + items.filter((i) => roleOf(i) !== 'accessory').map((i) => '<span class="mini' + (slot.role && roleOf(i) === slot.role ? ' sel' : '') + '">' + thumb(i, { noTag: true, noFlip: true }) + '</span>').join('') + '</span>' +
    '<span class="pct' + (comp.percent < 100 ? ' partial' : '') + '"><b class="num">' + comp.percent + '% completo</b></span></div>';
  const tabs = '<div class="swap-tabs" role="tablist">' + slots.map((s) => '<button type="button" role="tab" class="chip btnchip" data-act="swapSlot" data-slot="' + s.id + '" aria-selected="' + (s.id === slot.id) + '" aria-pressed="' + (s.id === slot.id) + '">' + esc(s.label) + '</button>').join('') + '</div>';
  let body = '';
  if (slot.id === 'extras') {
    const optional = items.filter((i) => roleOf(i) === 'accessory' || (roleOf(i) === 'layer' && !d.requiredSlots.includes('capa')));
    const addable = owned.filter((i) => (roleOf(i) === 'accessory' || (roleOf(i) === 'layer' && !d.requiredSlots.includes('capa'))) && !c.itemIds.includes(i.id));
    body = '<p class="tiny muted">Accesorios, bolsos y capas opcionales: no cambian la completitud.</p>' +
      (optional.length ? '<div class="stack tight"><span class="eyebrow">En este outfit</span>' + optional.map((i) => '<div class="swap-row cur"><span class="swap-th">' + thumb(i, { noTag: true, noFlip: true }) + '</span><span class="swap-info"><b>' + esc(i.name) + '</b><span class="tiny muted"><span class="code">' + esc(i.code || '') + '</span></span></span><button type="button" class="btn sm ghost" data-act="removePiece" data-item="' + i.id + '">Quitar</button></div>').join('') + '</div>' : '') +
      '<div class="stack tight"><span class="eyebrow">Puedes añadir</span>' + (addable.length ? addable.map((a) => swapRow(a, 'addPiece', '', d)).join('') : '<span class="small muted">No tienes más accesorios registrados.</span>') + '</div>';
  } else {

    const alts = owned.filter((i) => roleOf(i) === slot.role && (!cur || i.id !== cur.id) && !c.itemIds.includes(i.id) && meetsHard(i, (d.hard || {})[slot.hardSlot]));
    alts.sort((a, b2) => (isUsable(b2) - isUsable(a)) || (formalityOk(b2, d) - formalityOk(a, d)) || a.name.localeCompare(b2.name, 'es'));
    body = '<div class="stack tight"><span class="eyebrow">Ahora</span>' + (cur ? '<div class="swap-row cur"><span class="swap-th">' + thumb(cur, { noTag: true, noFlip: true }) + '</span><span class="swap-info"><b>' + esc(cur.name) + '</b><span class="tiny muted"><span class="code">' + esc(cur.code || '') + '</span> ' + esc(cur.color) + '</span></span><span class="badge ok">En uso</span></div>' : '<div class="note bad">Falta ' + esc(slot.label.toLowerCase()) + ' en este outfit.</div>') + '</div>' +
      '<div class="stack tight"><span class="eyebrow">' + (alts.length ? 'Cámbialo por' : 'Alternativas') + '</span>' + (alts.length ? alts.map((a) => swapRow(a, cur ? 'swapTo' : 'addPiece', cur ? cur.id : '', d)).join('') : '<span class="small muted">No tienes otras prendas compatibles de este tipo. Puedes agregar una desde tu armario.</span>') + '</div>';
